upload_max_filesize = 2048M
post_max_size = 2048M
memory_limit = 512M
max_execution_time = 900
max_input_time = 900

; Production security baseline. Upload limits above are intentionally large for
; All-in-One WP Migration; restrict access to wp-admin separately.
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax
session.use_strict_mode = On
cgi.fix_pathinfo = 0
max_input_vars = 5000
