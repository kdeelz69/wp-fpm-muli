services:
  mariadb_site1:
    image: mariadb:10.11
    container_name: wordpress_db_site1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SITE1_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SITE1_MYSQL_DATABASE}
      MYSQL_USER: ${SITE1_MYSQL_USER}
      MYSQL_PASSWORD: ${SITE1_MYSQL_PASSWORD}
    volumes:
      - db_data_site1:/var/lib/mysql
    networks:
      - wp_network_multi

  wordpress_site1:
    image: wordpress:${WORDPRESS_VERSION}-php${PHP_VERSION}-fpm
    restart: always
    depends_on:
      - mariadb_site1
    environment:
      WORDPRESS_DB_HOST: mariadb_site1:3306
      WORDPRESS_DB_NAME: ${SITE1_WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${SITE1_WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SITE1_WORDPRESS_DB_PASSWORD}
    volumes:
      - ./html/site1:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - wp_network_multi

  mariadb_site2:
    image: mariadb:10.11
    container_name: wordpress_db_site2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SITE2_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SITE2_MYSQL_DATABASE}
      MYSQL_USER: ${SITE2_MYSQL_USER}
      MYSQL_PASSWORD: ${SITE2_MYSQL_PASSWORD}
    volumes:
      - db_data_site2:/var/lib/mysql
    networks:
      - wp_network_multi

  wordpress_site2:
    image: wordpress:${WORDPRESS_VERSION}-php${PHP_VERSION}-fpm
    restart: always
    depends_on:
      - mariadb_site2
    environment:
      WORDPRESS_DB_HOST: mariadb_site2:3306
      WORDPRESS_DB_NAME: ${SITE2_WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${SITE2_WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${SITE2_WORDPRESS_DB_PASSWORD}
    volumes:
      - ./html/site2:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - wp_network_multi

  nginx_multi:
    image: nginx:stable
    restart: always
    depends_on:
      - wordpress_site1
      - wordpress_site2
    ports:
      - 80:80
      - 443:443
    environment:
      SITE1_DOMAIN: ${SITE1_DOMAIN}
      SITE1_WWW_DOMAIN: ${SITE1_WWW_DOMAIN}
      SITE2_DOMAIN: ${SITE2_DOMAIN}
      SITE2_WWW_DOMAIN: ${SITE2_WWW_DOMAIN}
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /etc/letsencrypt/live/$SITE1_DOMAIN/fullchain.pem ] && [ -f /etc/letsencrypt/live/$SITE1_DOMAIN/privkey.pem ] && [ -f /etc/letsencrypt/live/$SITE2_DOMAIN/fullchain.pem ] && [ -f /etc/letsencrypt/live/$SITE2_DOMAIN/privkey.pem ]; then
          envsubst '$$SITE1_DOMAIN $$SITE1_WWW_DOMAIN $$SITE2_DOMAIN $$SITE2_WWW_DOMAIN' < /etc/nginx/templates/ssl.conf.template > /etc/nginx/conf.d/default.conf;
        else
          envsubst '$$SITE1_DOMAIN $$SITE1_WWW_DOMAIN $$SITE2_DOMAIN $$SITE2_WWW_DOMAIN' < /etc/nginx/templates/http.conf.template > /etc/nginx/conf.d/default.conf;
        fi;
        nginx -t;
        nginx -g 'daemon off;'
    volumes:
      - ./nginx-multi-http.conf.template:/etc/nginx/templates/http.conf.template:ro
      - ./nginx-multi.conf.template:/etc/nginx/templates/ssl.conf.template:ro
      - ./html/site1:/var/www/site1:ro
      - ./html/site2:/var/www/site2:ro
      - ./html/.well-known/acme-challenge:/var/www/challenges/.well-known/acme-challenge:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - wp_network_multi

  certbot_multi:
    image: certbot/certbot
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./html/.well-known/acme-challenge:/var/www/challenges/.well-known/acme-challenge:rw
    networks:
      - wp_network_multi

volumes:
  db_data_site1:
  db_data_site2:

networks:
  wp_network_multi:
    driver: bridge
